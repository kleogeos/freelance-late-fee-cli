[project]
name = "freelance-late-fee-cli"
version = "1.0.0"
description = "Compute the late fee owed on an overdue freelance invoice and which reminder stage to send. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "invoice", "late-fee", "late-payment", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-late-fee-cli"
Repository = "https://github.com/kleogeos/freelance-late-fee-cli"

[project.scripts]
freelance-latefee = "latefee:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["latefee"]
